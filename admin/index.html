<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0907">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LEVIT Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LEVIT Admin</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="../fonts/playfair-display-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- sign in -->
<main class="auth" id="auth" hidden>
  <form class="auth__card" id="login" autocomplete="on">
    <p class="auth__logo">LEVIT</p>
    <h1>Admin</h1>
    <p class="auth__hint" id="auth-hint">Sign in to manage orders, products and content.</p>
    <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="current-password" required autofocus></label>
    <p class="auth__err" id="auth-err" role="alert"></p>
    <button class="btn btn--ink btn--lg" type="submit" id="login-btn">Sign in</button>
    <a class="auth__back" href="../">← Back to the store</a>
  </form>
</main>

<!-- app -->
<div class="shell" id="shell" hidden>
  <aside class="side" id="side" aria-label="Admin">
    <a class="side__brand" href="#/overview"><b>LEVIT</b><small>Admin</small></a>
    <nav class="side__nav" id="nav"></nav>
    <div class="side__foot">
      <a href="../" target="_blank" rel="noopener">View store ↗</a>
      <button type="button" id="logout">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="title">Overview</h1>
      <div class="top__actions" id="actions"></div>
      <button class="icon" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>

<!-- sheet (order details, editors, More menu) -->
<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1">
  <header class="panel__head"><span class="panel__grab" aria-hidden="true"></span><h2 id="panel-title"></h2><button class="x" id="panel-x" type="button" aria-label="Close">✕</button></header>
  <div class="panel__body" id="panel-body"></div>
  <footer class="panel__foot" id="panel-foot"></footer>
</aside>

<!-- confirm -->
<div class="dlg" id="dlg" hidden>
  <div class="dlg__box" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 id="dlg-t"></h2><p id="dlg-p"></p>
    <div class="dlg__btns"><button class="btn" id="dlg-no" type="button">Cancel</button><button class="btn btn--ink" id="dlg-yes" type="button">Confirm</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="admin.js"></script>
</body>
</html>
